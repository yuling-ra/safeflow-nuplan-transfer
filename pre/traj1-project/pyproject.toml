[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untitled1"
version = "0.1.0"
description = "Auto-converted VS Code project from Untitled1.ipynb"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "AutoGen"}]

[project.scripts]
untitled1-run = "untitled1.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
