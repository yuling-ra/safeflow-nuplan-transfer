[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-flow"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "tqdm",
    "matplotlib",
    "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffusion*"]
