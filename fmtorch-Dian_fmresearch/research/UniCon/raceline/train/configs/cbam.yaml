    # configs/racetrack_cbam_base.yaml
    data:
      # path 已被移除，将自动使用 research/UniCon/raceline/train/dataset/ 目录下的所有 .npz 文件
      batch_size: 1024
      val_split: 0.1
      workers: 4
      theta_sincos: false                  # 如需把theta变为(sin,cos)就开
      cache_scaler: true
    
    model:
      name: "flow_unet_cbam"  # <--- 选择我们的新模型
      width: 1024
      depth: 5
      img_shape: {C: 16, H: 28, W: 28}
      unet:
        # --- 常用于 Sweep 的参数 ---
        model_channels: 64
        num_res_blocks: 2
        attention_resolutions: [14, 7]
        channel_mult: [1, 2, 4]
      cbam:
        # --- CBAM 专属的可 Sweep 参数 ---
        reduction: 16
        heads: 4
        kernel_size: 7

    train:
      # ... (训练配置)
      epochs: 2000
      amp: true
      ema: { enable: true, decay: 0.999 }
      clip_grad_norm: 1.0
      grad_accum_steps: 1
      optimizer:
        name: "adamw"
        lr: 1.0e-4
        wd: 0.01
        betas: [0.9, 0.999]
      scheduler:
        name: "cosine"
        warmup_steps: 500
        min_lr: 1.0e-6
      val_interval_steps: 1000
      log_interval: 100
      save_every_epoch: 50
      seed: 42
      device: "cuda"

    log:
      save_dir: "./outputs/cbam_base_run"
      aim: { enable: true, repo: "aimlogs", experiment: "fm_cbam" }
      csv: { enable: true }
      save_ckpt_every_n_epochs: 50
      save_best_val: true