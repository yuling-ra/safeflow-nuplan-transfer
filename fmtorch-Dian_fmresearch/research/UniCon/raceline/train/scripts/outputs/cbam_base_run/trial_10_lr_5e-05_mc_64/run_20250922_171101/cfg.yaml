data:
  batch_size: 2048
  val_split: 0.1
  workers: 4
  theta_sincos: false
  cache_scaler: true
model:
  name: flow_unet_cbam
  width: 1024
  depth: 5
  img_shape:
    C: 16
    H: 28
    W: 28
  unet:
    model_channels: 64
    num_res_blocks: 2
    attention_resolutions:
    - 16
    - 8
    channel_mult:
    - 1
    - 2
    - 2
    - 4
  cbam:
    reduction: 16
    heads: 4
    kernel_size: 7
train:
  lr: 5.0e-05
  optimizer: adamw
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 100
  seed: 42
  device: cuda
log:
  save_dir: ./outputs/cbam_base_run/trial_10_lr_5e-05_mc_64
  aim:
    enable: true
    repo: aimlogs
    experiment: fm_cbam_trial_10
  csv:
    enable: true
  save_ckpt_every_n_epochs: 50
  save_best_val: true
